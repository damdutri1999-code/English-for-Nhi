<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Học tiếng Anh cùng Bạn Thỏ</title>
<meta name="theme-color" content="#ffd0e1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Baloo 2 và Nunito đều có đủ dấu tiếng Việt -->
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --p50:#fff6f9; --p100:#ffe8f0; --p200:#ffd0e1; --p300:#ffb0cd; --p400:#ff8db7;
  --p500:#f2639b; --p600:#c92f72; --p700:#9c2159;
  --ink:#4b2335; --ink2:#7d5566; --paper:#ffffff; --line:#ffd9e6;
  --ok:#1b7f55; --ok-bg:#e6f8ee; --bad:#b8323f; --bad-bg:#ffecee; --warn-bg:#fff2c4;
  --r:22px;
  --lift:0 5px 0 rgba(242,99,155,.16), 0 12px 26px rgba(201,47,114,.10);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.55; color:var(--ink); background:var(--p50);
  background-image:radial-gradient(var(--p100) 1.6px, transparent 1.7px);
  background-size:22px 22px;
}
h1,h2,h3{font-family:"Baloo 2","Nunito",sans-serif; line-height:1.2; margin:0 0 .4em; color:var(--ink)}
h1{font-size:1.7rem} h2{font-size:1.3rem} h3{font-size:1.1rem}
p{margin:0 0 .8em}
button{font:inherit; color:inherit; cursor:pointer}
a{color:var(--p600)}
:focus-visible{outline:3px solid var(--p600); outline-offset:2px; border-radius:10px}

.top{position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between;
  gap:12px; padding:10px 16px; background:rgba(255,246,249,.92); backdrop-filter:blur(8px); border-bottom:2px solid var(--line)}
.brand{display:flex; align-items:center; gap:10px}
.brand svg{width:40px; height:40px}
.brand b{font-family:"Baloo 2",sans-serif; font-size:1.05rem; display:block; line-height:1.1}
.brand small{color:var(--ink2); font-size:.8rem}
.sync{font-size:.8rem; font-weight:700; background:var(--paper); border:2px solid var(--line); border-radius:999px; padding:3px 10px; color:var(--ink2); white-space:nowrap}
.wrap{max-width:640px; margin:0 auto; padding:18px 16px 110px}

.tabs{position:fixed; left:0; right:0; bottom:0; z-index:30; display:flex; justify-content:center; gap:4px;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom)); background:var(--paper); border-top:2px solid var(--line)}
.tabs a{flex:1; max-width:112px; text-align:center; text-decoration:none; color:var(--ink2); font-weight:700; font-size:.76rem;
  padding:6px 4px; border-radius:16px; display:flex; flex-direction:column; align-items:center; gap:1px}
.tabs a span{font-size:1.35rem; line-height:1.2}
.tabs a.on{background:var(--p200); color:var(--p700)}
body.immersive .tabs{display:none}
body.immersive .wrap{padding-bottom:140px}

.card{background:var(--paper); border:2px solid var(--line); border-radius:var(--r); padding:18px; margin:0 0 16px; box-shadow:var(--lift)}
.card.flat{box-shadow:none}
.card.tint{background:var(--p100); border-color:var(--p200)}
.muted{color:var(--ink2)}
.small{font-size:.88rem}
.row{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.grow{flex:1; min-width:0}
.pill{display:inline-flex; align-items:center; gap:5px; background:var(--p100); color:var(--p700); font-weight:800;
  font-size:.82rem; padding:3px 11px; border-radius:999px; border:2px solid var(--p200)}
.pill.ok{background:var(--ok-bg); color:var(--ok); border-color:#bfe9d1}
.pill.lock{background:#f4eef1; color:#8a7580; border-color:#e6dde2}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:0; text-decoration:none; border-radius:18px; padding:13px 22px;
  font-weight:800; font-size:1.02rem; background:var(--p600); color:#fff; box-shadow:0 5px 0 var(--p700); transition:transform .08s, box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(4px); box-shadow:0 1px 0 var(--p700)}
.btn.soft{background:var(--p100); color:var(--p700); box-shadow:0 5px 0 var(--p200); border:2px solid var(--p200)}
.btn.soft:active:not(:disabled){box-shadow:0 1px 0 var(--p200)}
.btn.line{background:var(--paper); color:var(--p700); box-shadow:none; border:2px solid var(--p300)}
.btn.danger{background:var(--paper); color:var(--bad); box-shadow:none; border:2px solid #f2b8bf}
.btn:disabled{opacity:.45; cursor:not-allowed; box-shadow:none}
.btn.block{display:flex; width:100%}
.linkbtn{background:none; border:0; color:var(--ink2); text-decoration:underline; padding:6px; font-weight:700}

/* mascot speech */
.hello{display:flex; align-items:center; gap:14px; margin-bottom:14px}
.hello svg{width:92px; height:92px; flex:none}
.bubble{position:relative; background:var(--paper); border:2px solid var(--p200); border-radius:20px; padding:12px 16px; font-weight:700}
.bubble::before{content:""; position:absolute; left:-10px; top:28px; width:16px; height:16px; background:var(--paper);
  border-left:2px solid var(--p200); border-bottom:2px solid var(--p200); transform:rotate(45deg)}

.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px}
.stat{background:var(--paper); border:2px solid var(--line); border-radius:18px; padding:10px 6px; text-align:center}
.stat b{display:block; font-family:"Baloo 2",sans-serif; font-size:1.6rem; line-height:1.1; color:var(--p600)}
.stat span{font-size:.8rem; color:var(--ink2); font-weight:700}

.bar{height:14px; border-radius:99px; background:var(--p100); overflow:hidden; border:2px solid var(--p200)}
.bar i{display:block; height:100%; background:linear-gradient(90deg,var(--p400),var(--p500)); border-radius:99px; transition:width .5s}

/* garden */
.garden{display:grid; grid-template-columns:repeat(6,1fr); gap:6px}
.pot{text-align:center; font-size:.72rem; font-weight:800; color:var(--ink2)}
.pot svg{width:100%; max-width:56px; height:auto; display:block; margin:0 auto 2px}
.pot.on svg{animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(.3) rotate(-30deg)}70%{transform:scale(1.15) rotate(6deg)}100%{transform:scale(1) rotate(0)}}
.garden.big{grid-template-columns:repeat(3,1fr); gap:12px}
.garden.big .pot svg{max-width:84px}

/* week list */
.day{display:flex; gap:12px; align-items:center; text-decoration:none; color:inherit}
.day .when{flex:none; width:64px; height:64px; border-radius:18px; background:var(--p100); border:2px solid var(--p200);
  display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:"Baloo 2",sans-serif; font-weight:700; color:var(--p700); line-height:1.05}
.day .when small{font-family:"Nunito"; font-weight:700; font-size:.7rem; color:var(--ink2)}
.day.is-done .when{background:var(--ok-bg); border-color:#bfe9d1; color:var(--ok)}
.day.is-lock{opacity:.7}
.chips{display:flex; flex-wrap:wrap; gap:8px}

/* lesson shell */
.lhead{display:flex; align-items:center; gap:10px; margin-bottom:10px}
.lhead .back{flex:none; width:42px; height:42px; border-radius:14px; border:2px solid var(--p200); background:var(--paper); font-size:1.1rem; text-decoration:none; display:flex; align-items:center; justify-content:center; color:var(--p700)}
.lhead h1{font-size:1.15rem; margin:0}
.clock{font-weight:800; color:var(--ink2); font-size:.9rem; white-space:nowrap}
.steps{display:flex; gap:6px; overflow-x:auto; padding:2px 2px 10px; margin-bottom:6px; scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.stepbtn{flex:none; border:2px solid var(--p200); background:var(--paper); border-radius:16px; padding:6px 12px; font-weight:800; font-size:.82rem; color:var(--ink2); display:flex; flex-direction:column; align-items:center; min-width:74px}
.stepbtn span{font-size:1.15rem; line-height:1.3}
.stepbtn small{font-weight:700; font-size:.7rem}
.stepbtn.on{background:var(--p200); border-color:var(--p400); color:var(--p700)}
.stepbtn.done{border-color:#bfe9d1; background:var(--ok-bg); color:var(--ok)}
.stepbtn.on.done{border-color:var(--ok)}
.lbar{position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--paper); border-top:2px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom)); display:flex; gap:10px; justify-content:center}
.lbar .btn{flex:1; max-width:300px}
.lbar .btn.soft{flex:none}

/* reading */
.reading{font-size:1.2rem; line-height:1.95}
.reading p{margin:0 0 .5em}
.tok{border-radius:8px; padding:0 2px; cursor:pointer}
.tok:hover{background:var(--p100)}
.tok.vocab{border-bottom:3px dotted var(--p400)}
.tok.vocab.pick{background:var(--p200)}
.tok.sel{background:var(--p200); box-shadow:inset 0 0 0 2px var(--p500)}
.tok.right{background:var(--ok-bg); box-shadow:inset 0 0 0 2px var(--ok); color:var(--ok); font-weight:800}
.tok.wrong{background:var(--bad-bg); box-shadow:inset 0 0 0 2px var(--bad); text-decoration:line-through}
.tok.miss{background:var(--warn-bg); box-shadow:inset 0 0 0 2px #e2b100; font-weight:800}
.gloss{min-height:56px; background:var(--p100); border:2px dashed var(--p300); border-radius:16px; padding:10px 14px; margin-bottom:14px; font-weight:700; display:flex; align-items:center; gap:10px}
.say{border:0; background:var(--paper); border-radius:12px; width:38px; height:38px; font-size:1.1rem; border:2px solid var(--p200)}
.plays{font-weight:800; color:var(--ink2)}

/* exercises */
.exset{margin-bottom:6px}
.q{padding:14px 0; border-top:2px dashed var(--line)}
.q:first-child{border-top:0; padding-top:4px}
.qtext{font-weight:800; font-size:1.08rem; margin:0 0 10px}
.opts{display:grid; gap:8px}
.opt{display:block; width:100%; text-align:left; border:2px solid var(--p200); background:var(--paper); border-radius:16px; padding:11px 14px; font-weight:700}
.opt:hover{background:var(--p50)}
.opt.sel{border-color:var(--p500); background:var(--p100); box-shadow:inset 0 0 0 1px var(--p500)}
.opt.right{border-color:var(--ok); background:var(--ok-bg); color:var(--ok)}
.opt.wrong{border-color:var(--bad); background:var(--bad-bg); color:var(--bad)}
.bank{display:flex; flex-wrap:wrap; gap:8px; margin:8px 0}
.chip{border:2px solid var(--p300); background:var(--paper); border-radius:14px; padding:7px 14px; font-weight:800; font-size:1.02rem}
.chip.on{background:var(--p100); border-color:var(--p500)}
.chip.used{opacity:.3}
.answer-line{min-height:56px; border:2px dashed var(--p300); border-radius:16px; padding:8px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; background:var(--p50)}
.answer-line.empty::before{content:"Chạm vào các từ bên dưới để ghép câu"; color:var(--ink2); font-weight:700; padding:0 6px}
.answer-line.right{border-color:var(--ok); background:var(--ok-bg)}
.answer-line.wrong{border-color:var(--bad); background:var(--bad-bg)}
.gap{font-size:1.12rem; font-weight:700; line-height:2.3}
.blank{display:inline-block; min-width:76px; border:0; border-bottom:3px solid var(--p500); background:var(--p100); border-radius:10px 10px 0 0; padding:2px 12px; font-weight:800; font-size:1.05rem; color:var(--p700); margin:0 4px}
.blank.right{background:var(--ok-bg); color:var(--ok); border-color:var(--ok)}
.blank.wrong{background:var(--bad-bg); color:var(--bad); border-color:var(--bad)}
.txt{width:100%; border:2px solid var(--p200); border-radius:14px; padding:10px 14px; font:inherit; font-weight:700; background:var(--paper); color:var(--ink)}
.txt:focus{border-color:var(--p500); outline:none; box-shadow:0 0 0 3px var(--p200)}
.txt.inline{display:inline-block; width:130px; padding:4px 10px; margin:0 4px; text-align:center}
.txt.right{border-color:var(--ok); background:var(--ok-bg)}
.txt.wrong{border-color:var(--bad); background:var(--bad-bg)}
textarea.txt{resize:vertical; min-height:120px; font-weight:600; line-height:1.6}
.fbtxt{margin-top:8px; border-radius:14px; padding:9px 13px; font-weight:700}
.fbtxt.ok{background:var(--ok-bg); color:var(--ok)}
.fbtxt.bad{background:var(--bad-bg); color:var(--bad)}
.why{color:var(--ink); font-weight:600; margin-top:4px}
.score{display:flex; align-items:center; gap:12px; background:var(--p100); border:2px solid var(--p200); border-radius:18px; padding:10px 14px; margin-top:14px; font-weight:800}
.score svg{width:56px; height:56px; flex:none}

.gtable{width:100%; border-collapse:separate; border-spacing:0; margin:10px 0; font-weight:700}
.gtable th,.gtable td{padding:9px 12px; text-align:left; border-bottom:2px solid var(--line)}
.gtable th{background:var(--p100); color:var(--p700)}
.gtable td:nth-child(2){font-family:"Baloo 2",sans-serif; font-size:1.2rem; color:var(--p600)}
.model{background:var(--p100); border:2px dashed var(--p300); border-radius:16px; padding:12px 16px; margin-top:12px; font-weight:700}
.check{display:flex; gap:10px; align-items:center; padding:5px 0; font-weight:700}
.check input{width:22px; height:22px; accent-color:var(--p600)}

/* progress */
.hbar{display:grid; grid-template-columns:110px 1fr 56px; gap:10px; align-items:center; margin:8px 0; font-weight:700; font-size:.92rem}
.mist{border-top:2px dashed var(--line); padding:10px 0}
.mist:first-child{border-top:0}

/* vocab */
.flash{min-height:190px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:10px; border-radius:var(--r)}
.flash .w{font-family:"Baloo 2",sans-serif; font-size:2.4rem; color:var(--p600); line-height:1.1}
.flash .m{font-size:1.3rem; font-weight:800}
.boxdots{display:inline-flex; gap:3px}
.boxdots i{width:9px; height:9px; border-radius:50%; background:var(--p100); border:1.5px solid var(--p300)}
.boxdots i.f{background:var(--p500); border-color:var(--p500)}
.vrow{display:flex; align-items:center; gap:10px; padding:9px 0; border-top:2px dashed var(--line)}
.vrow:first-child{border-top:0}

.toast{position:fixed; left:50%; bottom:96px; transform:translate(-50%,20px); background:var(--ink); color:#fff; padding:10px 18px; border-radius:999px; font-weight:700; opacity:0; pointer-events:none; transition:.25s; z-index:60; max-width:90vw; text-align:center}
.toast.show{opacity:1; transform:translate(-50%,0)}

.celebrate{text-align:center; padding-top:10px}
.celebrate svg.mascot{width:150px; height:150px}
.petal{position:fixed; top:-30px; z-index:50; font-size:22px; pointer-events:none; animation:fall 4.2s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg); opacity:.7}}
@media (prefers-reduced-motion:reduce){
  .petal{display:none} .pot.on svg{animation:none} .bar i{transition:none} .btn{transition:none}
}
.login{max-width:380px; margin:40px auto}
.login label{display:block; font-weight:800; margin:10px 0 4px}
.err{color:var(--bad); font-weight:700; margin-top:8px}
@media (min-width:640px){ h1{font-size:2rem} .reading{font-size:1.28rem} }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span id="logo"></span><div><b>Học tiếng Anh</b><small id="mname">cùng Bạn Thỏ</small></div></div>
  <span class="sync" id="sync">💾 Lưu trên máy</span>
</header>
<main id="app" class="wrap"></main>
<nav class="tabs" id="tabs" aria-label="Điều hướng"></nav>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* =====================================================================
   CẤU HÌNH — chỉ cần sửa phần này
   ===================================================================== */
const CONFIG = {
  learnerName: "bạn",          // đổi thành tên học viên, ví dụ "Nhi"
  mascotName: "Bạn Thỏ",
  // Điền cấu hình Firebase (Project settings > Your apps > Web app) để bật đồng bộ.
  // Để null thì tiến độ chỉ lưu trong trình duyệt (localStorage).
  // firebase: { apiKey:"...", authDomain:"...", projectId:"...", appId:"..." },
  firebase: null,
  firebaseSdk: "https://www.gstatic.com/firebasejs/10.14.1/"
};
const KEY = "a1-english-progress-v1";

/* =====================================================================
   TIỆN ÍCH
   ===================================================================== */
const app = document.getElementById("app");
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)){
    if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (v === true) el.setAttribute(k, "");
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)){
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const dkey = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
const addDays = (n) => { const d = new Date(); d.setDate(d.getDate()+n); return dkey(d); };
const norm = s => String(s).toLowerCase().replace(/[’]/g,"'").replace(/[^a-z0-9'\s]/g,"").replace(/\s+/g," ").trim();
const fmt = sec => Math.floor(sec/60) + ":" + String(sec%60).padStart(2,"0");
function shuffle(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]];} return b; }
let toastTimer;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),2400); }

/* =====================================================================
   HÌNH VẼ: linh vật & hoa
   ===================================================================== */
function mascotSVG(mood){
  const mouth = mood === "cheer"
    ? '<path d="M52 85 q8 14 16 0z" fill="#ff6f9f" stroke="#4b2335" stroke-width="2.5" stroke-linejoin="round"/>'
    : '<path d="M52 86 q8 8 16 0" fill="none" stroke="#4b2335" stroke-width="3" stroke-linecap="round"/>';
  const sparkle = mood === "cheer" ? '<path d="M104 22l3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#ffd54d"/><path d="M14 40l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#ffd54d"/>' : "";
  return '<svg class="mascot" viewBox="0 0 120 120" role="img" aria-label="'+CONFIG.mascotName+'">'
   + '<g transform="rotate(-8 42 30)"><ellipse cx="42" cy="28" rx="12" ry="27" fill="#fff" stroke="#ff9cc0" stroke-width="3"/><ellipse cx="42" cy="31" rx="6" ry="19" fill="#ffc2d8"/></g>'
   + '<g transform="rotate(10 78 30)"><ellipse cx="78" cy="28" rx="12" ry="27" fill="#fff" stroke="#ff9cc0" stroke-width="3"/><ellipse cx="78" cy="31" rx="6" ry="19" fill="#ffc2d8"/></g>'
   + '<circle cx="60" cy="74" r="38" fill="#fff" stroke="#ff9cc0" stroke-width="3"/>'
   + '<path d="M46 40l14 7-14 7z M74 40l-14 7 14 7z" fill="#ff6f9f"/><circle cx="60" cy="47" r="4.5" fill="#c92f72"/>'
   + '<circle cx="47" cy="72" r="4.8" fill="#4b2335"/><circle cx="73" cy="72" r="4.8" fill="#4b2335"/>'
   + '<circle cx="48.6" cy="70.4" r="1.5" fill="#fff"/><circle cx="74.6" cy="70.4" r="1.5" fill="#fff"/>'
   + '<ellipse cx="37" cy="83" rx="7" ry="5" fill="#ff9cc0" opacity=".6"/><ellipse cx="83" cy="83" rx="7" ry="5" fill="#ff9cc0" opacity=".6"/>'
   + '<path d="M56 79q4 4 8 0q-4-2-8 0z" fill="#ff6f9f"/>' + mouth + sparkle + '</svg>';
}
const mascot = (mood) => h("span", {html: mascotSVG(mood)});
function flowerSVG(bloom){
  return bloom
   ? '<svg viewBox="0 0 60 60" aria-hidden="true"><g fill="#ff9cc0" stroke="#f2639b" stroke-width="1.5"><circle cx="30" cy="14" r="10"/><circle cx="45" cy="25" r="10"/><circle cx="39" cy="43" r="10"/><circle cx="21" cy="43" r="10"/><circle cx="15" cy="25" r="10"/></g><circle cx="30" cy="30" r="8" fill="#ffe27a" stroke="#e2b100" stroke-width="1.5"/></svg>'
   : '<svg viewBox="0 0 60 60" aria-hidden="true"><ellipse cx="30" cy="30" rx="10" ry="14" fill="#ffe8f0" stroke="#ffb0cd" stroke-width="3" stroke-dasharray="4 3"/></svg>';
}

/* =====================================================================
   TRẠNG THÁI & LƯU TRỮ (localStorage + Firebase tùy chọn)
   ===================================================================== */
const defaultState = () => ({ v:1, updatedAt:0, sessions:{}, vocab:{}, mistakes:[], activeDays:[], writing:{}, results:{} });
const normalize = o => Object.assign(defaultState(), o || {});
let S = defaultState();

function loadLocal(){ try { return normalize(JSON.parse(localStorage.getItem(KEY))); } catch(e){ return defaultState(); } }
const Cloud = { ready:false, uid:null, db:null, fb:null };
let pushTimer = null;
function setStatus(kind){
  const map = { local:"💾 Lưu trên máy", cloud:"☁️ Đã đồng bộ", saving:"☁️ Đang lưu…", error:"⚠️ Chưa đồng bộ" };
  document.getElementById("sync").textContent = map[kind] || map.local;
}
function save(){
  S.updatedAt = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
  scheduleCloud();
}
function scheduleCloud(){
  if (!Cloud.ready) return;
  setStatus("saving"); clearTimeout(pushTimer);
  pushTimer = setTimeout(async () => {
    try { await Cloud.fb.setDoc(Cloud.fb.doc(Cloud.db, "learners", Cloud.uid), JSON.parse(JSON.stringify(S))); setStatus("cloud"); }
    catch(e){ console.error(e); setStatus("error"); }
  }, 1200);
}
function showLogin(auth, signIn){
  return new Promise(resolve => {
    const err = h("div", {class:"err"});
    const email = h("input", {class:"txt", type:"email", autocomplete:"username", required:true});
    const pw = h("input", {class:"txt", type:"password", autocomplete:"current-password", required:true});
    const form = h("form", {class:"card login", onSubmit: async (e) => {
      e.preventDefault(); err.textContent = "";
      try { await signIn(auth, email.value.trim(), pw.value); resolve(); }
      catch(ex){ err.textContent = "Email hoặc mật khẩu chưa đúng, thử lại nhé."; }
    }}, h("div",{style:"text-align:center"}, mascot("happy")), h("h2",null,"Vào lớp học"),
       h("label",null,"Email"), email, h("label",null,"Mật khẩu"), pw, err,
       h("button",{class:"btn block",type:"submit",style:"margin-top:16px"},"Vào học"));
    app.replaceChildren(form);
  });
}
async function initCloud(){
  if (!CONFIG.firebase) { setStatus("local"); return; }
  setStatus("saving");
  try {
    const b = CONFIG.firebaseSdk;
    const [A, Au, F] = await Promise.all([import(b+"firebase-app.js"), import(b+"firebase-auth.js"), import(b+"firebase-firestore.js")]);
    const fbApp = A.initializeApp(CONFIG.firebase);
    const auth = Au.getAuth(fbApp); const db = F.getFirestore(fbApp);
    const user = await new Promise(res => { const un = Au.onAuthStateChanged(auth, u => { un(); res(u); }); });
    if (!user) await showLogin(auth, Au.signInWithEmailAndPassword);
    Cloud.uid = auth.currentUser.uid; Cloud.db = db; Cloud.fb = { doc:F.doc, setDoc:F.setDoc };
    const snap = await F.getDoc(F.doc(db, "learners", Cloud.uid));
    if (snap.exists() && (snap.data().updatedAt || 0) > (S.updatedAt || 0)) {
      S = normalize(snap.data());
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
    }
    Cloud.ready = true;
    await F.setDoc(F.doc(db, "learners", Cloud.uid), JSON.parse(JSON.stringify(S)));
    setStatus("cloud");
  } catch(e){ console.error(e); Cloud.ready = false; setStatus("error"); }
}

const allSessions = () => WEEK1.sessions;
const findSession = id => allSessions().find(s => s.id === id);
function ensureSession(id){
  if (!S.sessions[id]) { S.sessions[id] = { steps:{}, seconds:0, startedAt:Date.now(), done:false }; save(); }
  return S.sessions[id];
}
const isDone = id => !!(S.sessions[id] && S.sessions[id].done);
function streak(){
  const days = new Set(S.activeDays); const d = new Date(); let n = 0;
  if (!days.has(dkey(d))) d.setDate(d.getDate()-1);
  for (let i=0; i<400; i++){
    if (days.has(dkey(d))) n++;
    else if (d.getDay() !== 0) break;   // Chủ nhật nghỉ, không làm đứt chuỗi
    d.setDate(d.getDate()-1);
  }
  return n;
}
function addVocab(map){
  let added = 0;
  for (const [w, m] of Object.entries(map)){
    if (!S.vocab[w]) { S.vocab[w] = { m, box:0, due:addDays(1) }; added++; }
  }
  if (added) save();
}
const dueWords = () => Object.keys(S.vocab).filter(w => S.vocab[w].due <= dkey(new Date()));
const INTERVALS = [1,3,7,14,30];
function recordResult(set, items){
  if (set.ungraded) return;
  const r = S.results[set.type] || (S.results[set.type] = {right:0, total:0});
  items.forEach(x => {
    r.total++;
    if (x.ok) r.right++;
    else S.mistakes.push({ t:set.type, q:x.prompt, a:x.correct, why:x.why, at:dkey(new Date()) });
  });
  S.mistakes = S.mistakes.slice(-60);
  save();
}

/* =====================================================================
   ÂM THANH (bản mẫu dùng giọng đọc của trình duyệt; khi có file mp3 thì điền audioSrc)
   ===================================================================== */
let voices = [], audioToken = 0, audioEl = null;
if ("speechSynthesis" in window){ const lv = () => { voices = speechSynthesis.getVoices(); }; lv(); speechSynthesis.onvoiceschanged = lv; }
function stopAudio(){
  audioToken++;
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  if (audioEl){ audioEl.pause(); audioEl = null; }
}
function playAudio({text, src, rate}, onend){
  stopAudio(); const my = audioToken;
  const end = ok => { if (my === audioToken) onend && onend(ok); };
  if (src){ audioEl = new Audio(src); audioEl.playbackRate = rate || 1; audioEl.onended = () => end(true); audioEl.onerror = () => end(false); audioEl.play().catch(() => end(false)); return true; }
  if (!("speechSynthesis" in window)){ toast("Trình duyệt này chưa đọc được tiếng Anh"); return false; }
  const u = new SpeechSynthesisUtterance(text); u.lang = "en-US"; u.rate = rate || 1;
  const v = voices.find(x => /en[-_]US/i.test(x.lang)) || voices.find(x => /^en/i.test(x.lang)); if (v) u.voice = v;
  u.onend = () => end(true); u.onerror = () => end(false);
  speechSynthesis.speak(u); return true;
}

function mcqItem(it, onChange){
  let sel = -1, locked = false; const btns = [];
  const fbSlot = h("div");
  const el = h("div", {class:"q"}, h("p",{class:"qtext"}, it.q),
    h("div",{class:"opts"}, it.options.map((o,i) => { const b = h("button",{class:"opt",type:"button",onClick:() => {
      if (locked) return; sel = i; btns.forEach((x,j) => x.classList.toggle("sel", j===i)); onChange(); }}, o); btns.push(b); return b; })), fbSlot);
  return { el, fbSlot, isAnswered:() => sel >= 0, check(){ locked = true;
    btns.forEach((b,j) => { if (j === it.answer) b.classList.add("right"); else if (j === sel) b.classList.add("wrong"); });
    return { ok: sel === it.answer, correct: it.options[it.answer], why: it.why, prompt: it.q }; } };
}
function buildGap(set, onChange){
  const bank = set.bank.map((w,i) => ({w, i, used:false}));
  const blanks = set.items.map(() => ({v:null})); let locked = false;
  const bankEl = h("div",{class:"bank"});
  const rows = set.items.map((it, qi) => {
    const parts = it.text.split("___");
    const blankBtn = h("button",{class:"blank",type:"button",onClick:() => {
      if (locked) return; const b = blanks[qi]; if (b.v != null){ bank[b.v].used = false; b.v = null; refresh(); onChange(); } }});
    const fbSlot = h("div");
    return { blankBtn, fbSlot, el:h("div",{class:"q gap"}, parts[0], blankBtn, parts[1] || "", fbSlot) };
  });
  function refresh(){
    bankEl.replaceChildren(...bank.map(c => h("button",{class:"chip"+(c.used?" used":""),type:"button",disabled:c.used,onClick:() => {
      if (locked) return; const qi = blanks.findIndex(b => b.v == null); if (qi < 0) return;
      blanks[qi].v = c.i; c.used = true; refresh(); onChange(); }}, c.w)));
    rows.forEach((r, qi) => { const v = blanks[qi].v; r.blankBtn.textContent = v == null ? "＿＿＿" : bank[v].w; });
  }
  refresh();
  const items = set.items.map((it, qi) => ({ el:rows[qi].el, fbSlot:rows[qi].fbSlot, isAnswered:() => blanks[qi].v != null,
    check(){ locked = true; const user = bank[blanks[qi].v].w; const ok = user === it.answer;
      rows[qi].blankBtn.classList.add(ok ? "right" : "wrong");
      return { ok, correct: it.answer, why: it.why, prompt: it.text }; } }));
  return { head:[bankEl], items };
}
function reorderItem(it, onChange){
  const tiles = it.words.map((w,i) => ({w, i, used:false})), ans = []; let locked = false;
  const bankEl = h("div",{class:"bank"}), ansEl = h("div",{class:"answer-line empty"}), fbSlot = h("div");
  function refresh(){
    bankEl.replaceChildren(...tiles.map(t => h("button",{class:"chip"+(t.used?" used":""),type:"button",disabled:t.used,onClick:() => {
      if (locked) return; t.used = true; ans.push(t); refresh(); onChange(); }}, t.w)));
    ansEl.replaceChildren(...ans.map((t,k) => h("button",{class:"chip on",type:"button",onClick:() => {
      if (locked) return; t.used = false; ans.splice(k,1); refresh(); onChange(); }}, t.w)));
    ansEl.classList.toggle("empty", ans.length === 0);
  }
  refresh();
  return { el:h("div",{class:"q"}, ansEl, bankEl, fbSlot), fbSlot, isAnswered:() => ans.length === tiles.length,
    check(){ locked = true; const user = ans.map(t => t.w).join(" "); const ok = norm(user) === norm(it.answer);
      ansEl.classList.add(ok ? "right" : "wrong"); return { ok, correct: it.answer, why: it.why, prompt: it.words.join(" / ") }; } };
}
function fixItem(it, onChange){
  const fbSlot = h("div");
  const input = h("input",{class:"txt",type:"text",value:it.wrong,autocapitalize:"off",autocomplete:"off",spellcheck:"false",onInput:onChange});
  return { el:h("div",{class:"q"}, h("p",{class:"qtext"}, "Câu sai: ", h("span",{style:"color:var(--bad)"}, it.wrong)), input, fbSlot), fbSlot,
    isAnswered:() => input.value.trim() !== "" && input.value.trim() !== it.wrong,
    check(){ input.readOnly = true; const ok = [it.answer].concat(it.alt || []).some(a => norm(a) === norm(input.value));
      input.classList.add(ok ? "right" : "wrong"); return { ok, correct: it.answer, why: it.why, prompt: it.wrong }; } };
}
function formItem(it, onChange){
  const parts = it.text.split("___"), fbSlot = h("div");

    return [h("h1",null,"Sổ từ vựng"), h("p",{class:"muted"},"Từ mới được thêm sau mỗi bài đọc và ôn lại sau 1, 3, 7, 14 ngày."),
      h("div",{class:"card tint"}, h("div",{class:"row"}, h("div",{class:"grow"}, h("h3",{style:"margin:0"}, due.length ? due.length+" từ cần ôn hôm nay" : "Hôm nay không có từ nào cần ôn"), h("div",{class:"small muted"},words.length+" từ trong sổ")),
        h("button",{class:"btn",type:"button",disabled:!due.length,onClick:() => { review = {q:shuffle(due), i:0}; render(); }},"Ôn ngay"))),
      words.length ? h("div",{class:"card"}, words.sort().map(w => { const v = S.vocab[w];
        return h("div",{class:"vrow"}, h("button",{class:"say",type:"button","aria-label":"Nghe "+w,onClick:() => playAudio({text:w,rate:.8})},"🔊"),
          h("div",{class:"grow"}, h("b",null,w), h("div",{class:"small muted"},v.m)), h("span",{class:"boxdots",title:"Mức nhớ"}, [0,1,2,3,4].map(i => h("i",{class:i<=v.box&&v.box>0?"f":""})))); }))
        : h("div",{class:"card",style:"text-align:center"}, mascot("happy"), h("p",{class:"muted"},"Sổ còn trống. Hoàn thành bước Đọc trong một buổi học để thêm từ mới."))];
  }
  render(); return root;
}
function practiceView(type){
  const p = PRACTICE[type];
  if (!p) return h("div",null, h("h1",null,"Luyện thêm"), h("p",{class:"muted"},"Làm lại từng dạng bài bất cứ lúc nào, không cần đợi đến buổi học."),
    Object.entries(PRACTICE).map(([k,v]) => h("a",{class:"card day",href:"#/practice/"+k}, h("div",{class:"when",style:"font-size:1.7rem"},v.icon), h("div",{class:"grow"}, h("div",{style:"font-weight:800"},v.label), h("div",{class:"small muted"},v.desc)))));
  return h("div",null, h("a",{class:"btn soft",href:"#/practice"},"← Các dạng bài"), h("div",{class:"card",style:"margin-top:16px"}, exerciseSet(p.set)));
}
function progressView(){
  const list = allSessions(), doneN = list.filter(s => isDone(s.id)).length;
  const mins = Math.round(Object.values(S.sessions).reduce((a,s) => a + (s.seconds||0), 0) / 60);
  const fileIn = h("input",{type:"file",accept:"application/json",hidden:true,onChange:e => {
    const f = e.target.files[0]; if (!f) return; const rd = new FileReader();
    rd.onload = () => { try { S = normalize(JSON.parse(rd.result)); save(); toast("Đã khôi phục tiến độ"); route(); } catch(x){ toast("File không hợp lệ"); } }; rd.readAsText(f); }});
  const types = Object.keys(TYPE_LABEL).filter(k => S.results[k]);
  return h("div",null, h("h1",null,"Tiến độ"),
    h("div",{class:"stats"}, h("div",{class:"stat"},h("b",null,doneN),h("span",null,"buổi xong")), h("div",{class:"stat"},h("b",null,mins),h("span",null,"phút đã học")), h("div",{class:"stat"},h("b",null,Object.keys(S.vocab).length),h("span",null,"từ đã gặp"))),
    h("div",{class:"card"}, h("h3",null,"Vườn hoa tuần 1"), gardenEl(true), doneN === list.length ? h("p",{class:"pill ok",style:"margin-top:12px"},"Đã nhận sticker tuần 1") : h("p",{class:"muted small",style:"margin-top:12px"},"Xong cả 6 buổi để nhận sticker của tuần.")),
    h("div",{class:"card"}, h("h3",null,"Độ chính xác theo dạng bài"),
      types.length ? types.map(k => { const r = S.results[k], pc = Math.round(r.right/r.total*100);
        return h("div",{class:"hbar"}, h("span",null,TYPE_LABEL[k]), h("div",{class:"bar"},h("i",{style:"width:"+pc+"%"})), h("span",null,pc+"%")); })
        : h("p",{class:"muted"},"Làm vài bài tập để thấy thống kê ở đây.")),
    h("div",{class:"card"}, h("h3",null,"Những câu cần ôn lại"),
      S.mistakes.length ? S.mistakes.slice(-8).reverse().map(m => h("div",{class:"mist"}, h("div",{class:"small muted"},TYPE_LABEL[m.t]), h("div",{style:"font-weight:700"},m.q), h("div",null,"Đáp án: ",h("b",null,m.a)), m.why ? h("div",{class:"small muted"},"💡 "+m.why) : null))
        : h("p",{class:"muted"},"Chưa có câu sai nào. Các câu sai sẽ được gom ở đây để ôn.")),
    h("div",{class:"card flat"}, h("h3",null,"Sao lưu"), h("p",{class:"muted small"},"Tải tiến độ về máy hoặc khôi phục từ file đã lưu."),
      h("div",{class:"row"}, h("button",{class:"btn soft",type:"button",onClick:() => {
          const a = h("a",{href:URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:"application/json"})),download:"tien-do-hoc.json"}); document.body.append(a); a.click(); a.remove(); }},"Tải về"),
        h("button",{class:"btn soft",type:"button",onClick:() => fileIn.click()},"Khôi phục"), fileIn,
        h("button",{class:"btn danger",type:"button",onClick:() => { if (confirm("Xóa toàn bộ tiến độ? Không thể hoàn tác.")){ S = defaultState(); save(); route(); } }},"Xóa tiến độ"))));
}

/* =====================================================================
   ĐIỀU HƯỚNG
   ===================================================================== */
const TABS = [["home","🏠","Trang chủ"],["week","📅","Tuần học"],["vocab","📖","Từ vựng"],["practice","✏️","Bài tập"],["progress","🌸","Tiến độ"]];
const tabsEl = document.getElementById("tabs");
tabsEl.replaceChildren(...TABS.map(([p,ic,t]) => h("a",{href:"#/"+p,"data-p":p}, h("span",null,ic), t)));
function route(){
  stopAudio(); activeLesson = null; review = null;
  const parts = location.hash.replace(/^#\/?/,"").split("/"), page = parts[0] || "home";
  document.body.classList.toggle("immersive", page === "lesson");
  let view;
  switch (page){
    case "week": view = weekView(); break;
    case "lesson": view = lessonView(parts[1], parseInt(parts[2] || "0", 10)); break;
    case "done": view = doneView(parts[1]); break;
    case "vocab": view = vocabView(); break;
    case "practice": view = practiceView(parts[1]); break;
    case "progress": view = progressView(); break;
    default: view = homeView();
  }
  app.replaceChildren(view); window.scrollTo(0,0);
  tabsEl.querySelectorAll("a").forEach(a => a.classList.toggle("on", a.dataset.p === page));
}
setInterval(() => {
  if (!activeLesson || document.hidden) return;
  const s = ensureSession(activeLesson); s.seconds = (s.seconds || 0) + 1;
  const c = document.getElementById("clock"); if (c) c.textContent = "⏱ " + fmt(s.seconds);
  if (s.seconds % 10 === 0) save();
}, 1000);

async function boot(){
  document.getElementById("logo").innerHTML = mascotSVG("happy");
  document.getElementById("mname").textContent = "cùng " + CONFIG.mascotName;
  S = loadLocal();
  await initCloud();
  window.addEventListener("hashchange", route);
  route();
}
boot();
})();
</script>
