<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Học tiếng Anh cùng Thỏ ngọc</title>
<meta name="theme-color" content="#ffd0e1">
<script>try{var t=localStorage.getItem("a1-theme");if(t==="night"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Học Anh">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Baloo 2 và Nunito đều có đủ dấu tiếng Việt -->
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --p50:#fff6f9; --p100:#ffe8f0; --p200:#ffd0e1; --p300:#ffb0cd; --p400:#ff8db7;
  --p500:#f2639b; --p600:#c92f72; --p700:#9c2159;
  --ink:#4b2335; --ink2:#7d5566; --paper:#ffffff; --line:#ffd9e6;
  --ok:#1b7f55; --ok-bg:#e6f8ee; --bad:#b8323f; --bad-bg:#ffecee; --warn-bg:#fff2c4;
  --r:22px;
  --lift:0 5px 0 rgba(242,99,155,.16), 0 12px 26px rgba(201,47,114,.10);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.55; color:var(--ink); background:var(--p50);
  background-image:radial-gradient(var(--p100) 1.6px, transparent 1.7px);
  background-size:22px 22px;
}
h1,h2,h3{font-family:"Baloo 2","Nunito",sans-serif; line-height:1.2; margin:0 0 .4em; color:var(--ink)}
h1{font-size:1.7rem} h2{font-size:1.3rem} h3{font-size:1.1rem}
p{margin:0 0 .8em}
button{font:inherit; color:inherit; cursor:pointer}
a{color:var(--p600)}
:focus-visible{outline:3px solid var(--p600); outline-offset:2px; border-radius:10px}

.top{position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between;
  gap:12px; padding:10px 16px; background:rgba(255,246,249,.92); backdrop-filter:blur(8px); border-bottom:2px solid var(--line)}
.brand{display:flex; align-items:center; gap:10px}
.brand svg{width:40px; height:40px}
.brand b{font-family:"Baloo 2",sans-serif; font-size:1.05rem; display:block; line-height:1.1}
.brand small{color:var(--ink2); font-size:.8rem}
.sync{font-size:.8rem; font-weight:700; background:var(--paper); border:2px solid var(--line); border-radius:999px; padding:3px 10px; color:var(--ink2); white-space:nowrap}
.wrap{max-width:640px; margin:0 auto; padding:18px 16px 110px}

.tabs{position:fixed; left:0; right:0; bottom:0; z-index:30; display:flex; justify-content:center; gap:4px;
  padding:8px 8px calc(8px + env(safe-area-inset-bottom)); background:var(--paper); border-top:2px solid var(--line)}
.tabs a{flex:1; max-width:112px; text-align:center; text-decoration:none; color:var(--ink2); font-weight:700; font-size:.76rem;
  padding:6px 4px; border-radius:16px; display:flex; flex-direction:column; align-items:center; gap:1px}
.tabs a span{font-size:1.35rem; line-height:1.2}
.tabs a.on{background:var(--p200); color:var(--p700)}
body.immersive .tabs{display:none}
body.immersive .wrap{padding-bottom:140px}

.card{background:var(--paper); border:2px solid var(--line); border-radius:var(--r); padding:18px; margin:0 0 16px; box-shadow:var(--lift)}
.card.flat{box-shadow:none}
.card.tint{background:var(--p100); border-color:var(--p200)}
.muted{color:var(--ink2)}
.small{font-size:.88rem}
.row{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.grow{flex:1; min-width:0}
.pill{display:inline-flex; align-items:center; gap:5px; background:var(--p100); color:var(--p700); font-weight:800;
  font-size:.82rem; padding:3px 11px; border-radius:999px; border:2px solid var(--p200)}
.pill.ok{background:var(--ok-bg); color:var(--ok); border-color:#bfe9d1}
.pill.lock{background:#f4eef1; color:#8a7580; border-color:#e6dde2}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:0; text-decoration:none; border-radius:18px; padding:13px 22px;
  font-weight:800; font-size:1.02rem; background:var(--p600); color:#fff; box-shadow:0 5px 0 var(--p700); transition:transform .08s, box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(4px); box-shadow:0 1px 0 var(--p700)}
.btn.soft{background:var(--p100); color:var(--p700); box-shadow:0 5px 0 var(--p200); border:2px solid var(--p200)}
.btn.soft:active:not(:disabled){box-shadow:0 1px 0 var(--p200)}
.btn.line{background:var(--paper); color:var(--p700); box-shadow:none; border:2px solid var(--p300)}
.btn.danger{background:var(--paper); color:var(--bad); box-shadow:none; border:2px solid #f2b8bf}
.btn:disabled{opacity:.45; cursor:not-allowed; box-shadow:none}
.btn.block{display:flex; width:100%}
.linkbtn{background:none; border:0; color:var(--ink2); text-decoration:underline; padding:6px; font-weight:700}

/* mascot speech */
.hello{display:flex; align-items:center; gap:14px; margin-bottom:14px}
.hello svg{width:92px; height:92px; flex:none}
.bubble{position:relative; background:var(--paper); border:2px solid var(--p200); border-radius:20px; padding:12px 16px; font-weight:700}
.bubble::before{content:""; position:absolute; left:-10px; top:28px; width:16px; height:16px; background:var(--paper);
  border-left:2px solid var(--p200); border-bottom:2px solid var(--p200); transform:rotate(45deg)}

.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px}
.stat{background:var(--paper); border:2px solid var(--line); border-radius:18px; padding:10px 6px; text-align:center}
.stat b{display:block; font-family:"Baloo 2",sans-serif; font-size:1.6rem; line-height:1.1; color:var(--p600)}
.stat span{font-size:.8rem; color:var(--ink2); font-weight:700}

.bar{height:14px; border-radius:99px; background:var(--p100); overflow:hidden; border:2px solid var(--p200)}
.bar i{display:block; height:100%; background:linear-gradient(90deg,var(--p400),var(--p500)); border-radius:99px; transition:width .5s}

/* garden */
.garden{display:grid; grid-template-columns:repeat(6,1fr); gap:6px}
.pot{text-align:center; font-size:.72rem; font-weight:800; color:var(--ink2)}
.pot svg{width:100%; max-width:56px; height:auto; display:block; margin:0 auto 2px}
.pot.on svg{animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(.3) rotate(-30deg)}70%{transform:scale(1.15) rotate(6deg)}100%{transform:scale(1) rotate(0)}}
.garden.big{grid-template-columns:repeat(3,1fr); gap:12px}
.garden.big .pot svg{max-width:84px}

/* week list */
.day{display:flex; gap:12px; align-items:center; text-decoration:none; color:inherit}
.day .when{flex:none; width:64px; height:64px; border-radius:18px; background:var(--p100); border:2px solid var(--p200);
  display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:"Baloo 2",sans-serif; font-weight:700; color:var(--p700); line-height:1.05}
.day .when small{font-family:"Nunito"; font-weight:700; font-size:.7rem; color:var(--ink2)}
.day.is-done .when{background:var(--ok-bg); border-color:#bfe9d1; color:var(--ok)}
.day.is-lock{opacity:.7}
.chips{display:flex; flex-wrap:wrap; gap:8px}

/* lesson shell */
.lhead{display:flex; align-items:center; gap:10px; margin-bottom:10px}
.lhead .back{flex:none; width:42px; height:42px; border-radius:14px; border:2px solid var(--p200); background:var(--paper); font-size:1.1rem; text-decoration:none; display:flex; align-items:center; justify-content:center; color:var(--p700)}
.lhead h1{font-size:1.15rem; margin:0}
.clock{font-weight:800; color:var(--ink2); font-size:.9rem; white-space:nowrap}
.steps{display:flex; gap:6px; overflow-x:auto; padding:2px 2px 10px; margin-bottom:6px; scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.stepbtn{flex:none; border:2px solid var(--p200); background:var(--paper); border-radius:16px; padding:6px 12px; font-weight:800; font-size:.82rem; color:var(--ink2); display:flex; flex-direction:column; align-items:center; min-width:74px}
.stepbtn span{font-size:1.15rem; line-height:1.3}
.stepbtn small{font-weight:700; font-size:.7rem}
.stepbtn.on{background:var(--p200); border-color:var(--p400); color:var(--p700)}
.stepbtn.done{border-color:#bfe9d1; background:var(--ok-bg); color:var(--ok)}
.stepbtn.on.done{border-color:var(--ok)}
.lbar{position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--paper); border-top:2px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom)); display:flex; gap:10px; justify-content:center}
.lbar .btn{flex:1; max-width:300px}
.lbar .btn.soft{flex:none}

/* reading */
.reading{font-size:1.2rem; line-height:1.95}
.reading p{margin:0 0 .5em}
.tok{border-radius:8px; padding:0 2px; cursor:pointer}
.tok:hover{background:var(--p100)}
.tok.vocab{border-bottom:3px dotted var(--p400)}
.tok.vocab.pick{background:var(--p200)}
.tok.sel{background:var(--p200); box-shadow:inset 0 0 0 2px var(--p500)}
.tok.right{background:var(--ok-bg); box-shadow:inset 0 0 0 2px var(--ok); color:var(--ok); font-weight:800}
.tok.wrong{background:var(--bad-bg); box-shadow:inset 0 0 0 2px var(--bad); text-decoration:line-through}
.tok.miss{background:var(--warn-bg); box-shadow:inset 0 0 0 2px #e2b100; font-weight:800}
.gloss{min-height:56px; background:var(--p100); border:2px dashed var(--p300); border-radius:16px; padding:10px 14px; margin-bottom:14px; font-weight:700; display:flex; align-items:center; gap:10px}
.say{border:0; background:var(--paper); border-radius:12px; width:38px; height:38px; font-size:1.1rem; border:2px solid var(--p200)}
.plays{font-weight:800; color:var(--ink2)}

/* exercises */
.exset{margin-bottom:6px}
.q{padding:14px 0; border-top:2px dashed var(--line)}
.q:first-child{border-top:0; padding-top:4px}
.qtext{font-weight:800; font-size:1.08rem; margin:0 0 10px}
.opts{display:grid; gap:8px}
.opt{display:block; width:100%; text-align:left; border:2px solid var(--p200); background:var(--paper); border-radius:16px; padding:11px 14px; font-weight:700}
.opt:hover{background:var(--p50)}
.opt.sel{border-color:var(--p500); background:var(--p100); box-shadow:inset 0 0 0 1px var(--p500)}
.opt.right{border-color:var(--ok); background:var(--ok-bg); color:var(--ok)}
.opt.wrong{border-color:var(--bad); background:var(--bad-bg); color:var(--bad)}
.bank{display:flex; flex-wrap:wrap; gap:8px; margin:8px 0}
.chip{border:2px solid var(--p300); background:var(--paper); border-radius:14px; padding:7px 14px; font-weight:800; font-size:1.02rem}
.chip.on{background:var(--p100); border-color:var(--p500)}
.chip.used{opacity:.3}
.answer-line{min-height:56px; border:2px dashed var(--p300); border-radius:16px; padding:8px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; background:var(--p50)}
.answer-line.empty::before{content:"Chạm vào các từ bên dưới để ghép câu"; color:var(--ink2); font-weight:700; padding:0 6px}
.answer-line.right{border-color:var(--ok); background:var(--ok-bg)}
.answer-line.wrong{border-color:var(--bad); background:var(--bad-bg)}
.gap{font-size:1.12rem; font-weight:700; line-height:2.3}
.blank{display:inline-block; min-width:76px; border:0; border-bottom:3px solid var(--p500); background:var(--p100); border-radius:10px 10px 0 0; padding:2px 12px; font-weight:800; font-size:1.05rem; color:var(--p700); margin:0 4px}
.blank.right{background:var(--ok-bg); color:var(--ok); border-color:var(--ok)}
.blank.wrong{background:var(--bad-bg); color:var(--bad); border-color:var(--bad)}
.txt{width:100%; border:2px solid var(--p200); border-radius:14px; padding:10px 14px; font:inherit; font-weight:700; background:var(--paper); color:var(--ink)}
.txt:focus{border-color:var(--p500); outline:none; box-shadow:0 0 0 3px var(--p200)}
.txt.inline{display:inline-block; width:130px; padding:4px 10px; margin:0 4px; text-align:center}
.txt.right{border-color:var(--ok); background:var(--ok-bg)}
.txt.wrong{border-color:var(--bad); background:var(--bad-bg)}
textarea.txt{resize:vertical; min-height:120px; font-weight:600; line-height:1.6}
.fbtxt{margin-top:8px; border-radius:14px; padding:9px 13px; font-weight:700}
.fbtxt.ok{background:var(--ok-bg); color:var(--ok)}
.fbtxt.bad{background:var(--bad-bg); color:var(--bad)}
.why{color:var(--ink); font-weight:600; margin-top:4px}
.score{display:flex; align-items:center; gap:12px; background:var(--p100); border:2px solid var(--p200); border-radius:18px; padding:10px 14px; margin-top:14px; font-weight:800}
.score svg{width:56px; height:56px; flex:none}

.gtable{width:100%; border-collapse:separate; border-spacing:0; margin:10px 0; font-weight:700}
.gtable th,.gtable td{padding:9px 12px; text-align:left; border-bottom:2px solid var(--line)}
.gtable th{background:var(--p100); color:var(--p700)}
.gtable td:nth-child(2){font-family:"Baloo 2",sans-serif; font-size:1.2rem; color:var(--p600)}
.model{background:var(--p100); border:2px dashed var(--p300); border-radius:16px; padding:12px 16px; margin-top:12px; font-weight:700}
.check{display:flex; gap:10px; align-items:center; padding:5px 0; font-weight:700}
.check input{width:22px; height:22px; accent-color:var(--p600)}

/* progress */
.hbar{display:grid; grid-template-columns:110px 1fr 56px; gap:10px; align-items:center; margin:8px 0; font-weight:700; font-size:.92rem}
.mist{border-top:2px dashed var(--line); padding:10px 0}
.mist:first-child{border-top:0}

/* vocab */
.flash{min-height:190px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:10px; border-radius:var(--r)}
.flash .w{font-family:"Baloo 2",sans-serif; font-size:2.4rem; color:var(--p600); line-height:1.1}
.flash .m{font-size:1.3rem; font-weight:800}
.boxdots{display:inline-flex; gap:3px}
.boxdots i{width:9px; height:9px; border-radius:50%; background:var(--p100); border:1.5px solid var(--p300)}
.boxdots i.f{background:var(--p500); border-color:var(--p500)}
.vrow{display:flex; align-items:center; gap:10px; padding:9px 0; border-top:2px dashed var(--line)}
.vrow:first-child{border-top:0}

.toast{position:fixed; left:50%; bottom:96px; transform:translate(-50%,20px); background:var(--ink); color:#fff; padding:10px 18px; border-radius:999px; font-weight:700; opacity:0; pointer-events:none; transition:.25s; z-index:60; max-width:90vw; text-align:center}
.toast.show{opacity:1; transform:translate(-50%,0)}

.celebrate{text-align:center; padding-top:10px}
.celebrate svg.mascot{width:150px; height:150px}
.petal{position:fixed; top:-30px; z-index:50; font-size:22px; pointer-events:none; animation:fall 4.2s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg); opacity:.7}}
@media (prefers-reduced-motion:reduce){
  .petal{display:none} .pot.on svg{animation:none} .bar i{transition:none} .btn{transition:none}
}
.login{max-width:380px; margin:40px auto}
.login label{display:block; font-weight:800; margin:10px 0 4px}
.err{color:var(--bad); font-weight:700; margin-top:8px}
.hr{display:flex; align-items:center; gap:8px}
.gear{width:38px; height:38px; flex:none; border-radius:12px; border:2px solid var(--line); background:var(--paper); display:flex; align-items:center; justify-content:center; text-decoration:none; font-size:1.1rem}
.sticky{background:#fff6cf; border-color:#f0d878}
.cal-h{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px}
.cal-g{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; text-align:center}
.cal-w{font-size:.72rem; font-weight:800; color:var(--ink2)}
.cal-c{aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:50%; font-weight:700; font-size:.9rem; color:var(--ink2)}
.cal-c.sun{color:#b79aa8}
.cal-c.on{background:var(--p600); color:#fff; box-shadow:0 3px 0 var(--p700)}
.cal-c.today{outline:3px solid var(--p400); outline-offset:1px}
.stks{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.stk{background:var(--p50); border:2px solid var(--p200); border-radius:18px; padding:10px 6px; text-align:center}
.stk i{font-style:normal; font-size:2rem; display:block; line-height:1.3}
.stk b{font-size:.84rem; display:block; line-height:1.2; margin-bottom:2px}
.stk small{font-size:.72rem; color:var(--ink2); display:block; line-height:1.25}
.stk.lock{filter:grayscale(1); opacity:.55}
.mchoice{flex:1; border:2px solid var(--p200); background:var(--paper); border-radius:18px; padding:8px 4px; font-weight:800; display:flex; flex-direction:column; align-items:center; gap:2px}
.mchoice svg{width:64px; height:64px}
.mchoice.on{border-color:var(--p600); background:var(--p100)}
.cmp{display:grid; gap:10px}
@media (min-width:560px){ .cmp{grid-template-columns:1fr 1fr} }
.tl{display:flex; gap:10px; align-items:center; padding:8px 0; border-top:2px dashed var(--line)}
.tl:first-of-type{border-top:0}
@media (min-width:640px){ h1{font-size:2rem} .reading{font-size:1.28rem} }

/* ===== Mochi + 2 giao diện (sáng / đêm) ===== */
:root{--r:28px; --lift:0 8px 18px rgba(242,99,155,.16)}
.btn{border-radius:999px}
.stat{border-radius:26px; border-color:transparent; box-shadow:0 8px 16px rgba(242,99,155,.14)}
.tabs{left:12px; right:12px; bottom:10px; max-width:616px; margin:0 auto; border:0; border-radius:30px; padding:6px; box-shadow:0 10px 24px rgba(242,99,155,.28)}
.tabs a{border-radius:999px}
.wrap{padding-bottom:124px}
.brand svg{width:38px; height:46px}
.hello svg{width:88px; height:107px}
.score svg{width:50px; height:61px}
.mchoice svg{width:64px; height:78px}
.celebrate svg.mascot{width:140px; height:171px}
.mascot{filter:drop-shadow(0 5px 5px rgba(156,33,89,.25)); overflow:visible}
.mascot.cheer{animation:hop .9s ease-in-out infinite}
.mascot.sleepy{animation:bob 3.2s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
.const{position:relative; height:282px; border-radius:36px; overflow:hidden; margin-bottom:16px; color:#fff;
  background:radial-gradient(120% 90% at 30% 0%,#d44d8d 0%,#8c3070 55%,#6a2458 100%); box-shadow:0 12px 26px rgba(122,42,98,.35)}
.const svg.sky{position:absolute; inset:0; width:100%; height:100%}
.const .ct{position:absolute; left:18px; top:12px; font-family:"Baloo 2",sans-serif; font-weight:800; font-size:1.05rem; color:#fff; max-width:62%}
.const .cp{position:absolute; right:14px; top:12px; background:#fff; color:var(--p700); border-radius:999px; padding:3px 12px; font-size:.82rem; font-weight:800}
.const .cb{position:absolute; left:18px; right:100px; bottom:16px; height:8px; border-radius:99px; background:rgba(255,255,255,.25)}
.const .cb i{display:block; height:100%; border-radius:99px; background:#ffe27a}
.const .corner{position:absolute; right:10px; bottom:6px}
.const .corner svg{width:62px; height:76px; filter:none}
.pulse{transform-box:fill-box; transform-origin:center; animation:pl 2.4s ease-in-out infinite}
@keyframes pl{0%,100%{transform:scale(1); opacity:1}50%{transform:scale(1.25); opacity:.45}}
.themebtn{cursor:pointer; font:inherit}
.top{padding:8px 12px; gap:8px}
.hr{gap:6px}
.gear{width:34px; height:34px}
.brand{gap:8px; min-width:0}
.brand b{font-size:.95rem; white-space:nowrap}
.brand small{font-size:.72rem; white-space:nowrap}
@media (max-width:430px){ .sync{font-size:.7rem; padding:3px 8px} }
.swatch{width:64px; height:78px; border-radius:22px; border:2px solid var(--p200)}
.swatch.light{background:linear-gradient(180deg,#fff6f9,#ffc2d8)}
.swatch.night{background:linear-gradient(180deg,#f9b4cf,#9a4478 55%,#3f1a47)}
@media (prefers-reduced-motion:reduce){ .mascot,.pulse{animation:none} }

html[data-theme=night] .top{background:rgba(58,22,64,.94); border-bottom-color:rgba(255,255,255,.12)}
html[data-theme=night] .brand b{color:#fff}
html[data-theme=night] .brand small{color:#e9c3d8}

<script>
(() => {
'use strict';

/* =====================================================================
   CẤU HÌNH — chỉ cần sửa phần này
   ===================================================================== */
const CONFIG = {
  learnerName: "bạn",          // tên mặc định; có thể đổi trong Cài đặt
  // Giọng đọc ưu tiên: chọn giọng có tên chứa chữ này. Trên Microsoft Edge sẽ có
  // "Microsoft Sonia Online (Natural) - English (United Kingdom)". Máy nào không có giọng
  // này thì tự dùng giọng tiếng Anh khác. Để "" nếu không muốn ưu tiên giọng nào.
  voiceName: "Sonia",
  // Đồng bộ qua Supabase (không đăng nhập). Để null thì tiến độ chỉ lưu trong trình duyệt.
  supabase: { url:"https://knxubkyjvkzltvgvpnfx.supabase.co", key:"sb_publishable_n4w0ocz9UE-yErwG6zW8pw__0okshxg" },
  // Tên dòng lưu tiến độ. Phải trùng với đoạn SQL (policy) trong Supabase.
  docId: "learner-nhi-7k3q9x2m"
};
const KEY = "a1-english-progress-v1";

/* =====================================================================
   TIỆN ÍCH
   ===================================================================== */
const app = document.getElementById("app");
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)){
    if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (v === true) el.setAttribute(k, "");
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)){
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const dkey = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
const addDays = (n) => { const d = new Date(); d.setDate(d.getDate()+n); return dkey(d); };
const parseKey = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d); };
const mondayOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay()+6) % 7)); return x; };
const norm = s => String(s).toLowerCase().replace(/[’]/g,"'").replace(/[^a-z0-9'\s]/g,"").replace(/\s+/g," ").trim();
const fmt = sec => Math.floor(sec/60) + ":" + String(sec%60).padStart(2,"0");
function shuffle(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]];} return b; }
let toastTimer;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),2400); }

/* =====================================================================
   LINH VẬT & HOA (3 linh vật để chọn thử)
   ===================================================================== */
const MASCOTS = { bunny:{name:"Thỏ ngọc"}, hang:{name:"Chị Hằng"} };
const THEMES = { light:{name:"Mochi sáng"}, night:{name:"Đêm chòm sao"} };
function mascotKind(){ return (S && S.settings && MASCOTS[S.settings.mascot]) ? S.settings.mascot : "bunny"; }
function themeKind(){
  if (S && S.settings && THEMES[S.settings.theme]) return S.settings.theme;
  try { const t = localStorage.getItem("a1-theme"); if (THEMES[t]) return t; } catch(e){}
  return "light";
}
function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  try { localStorage.setItem("a1-theme", t); } catch(e){}
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute("content", t === "night" ? "#3a1640" : "#ffd0e1");
  const b = document.getElementById("themebtn"); if (b){ b.textContent = t === "night" ? "☀️" : "🌙"; b.title = t === "night" ? "Chuyển sang giao diện sáng" : "Chuyển sang giao diện đêm"; }
}
const STAR_D = "M0-10L2.6-2.6L10 0L2.6 2.6L0 10L-2.6 2.6L-10 0L-2.6-2.6Z";
const starP = (x,y,sc,fill,extra) => '<path d="'+STAR_D+'" transform="translate('+x+' '+y+') scale('+sc+')" fill="'+fill+'" '+(extra||"")+' stroke-linejoin="round"/>';
const INK = "#4b2335";
function plushEyes(mood, xs, y){
  return xs.map(x => mood === "cheer"
    ? '<path d="M'+(x-8)+' '+(y+3)+'Q'+x+' '+(y-9)+' '+(x+8)+' '+(y+3)+'" fill="none" stroke="'+INK+'" stroke-width="3.4" stroke-linecap="round"/>'
    : mood === "sleepy"
    ? '<path d="M'+(x-8)+' '+(y-1)+'Q'+x+' '+(y+8)+' '+(x+8)+' '+(y-1)+'" fill="none" stroke="'+INK+'" stroke-width="3.2" stroke-linecap="round"/>'
    : '<ellipse cx="'+x+'" cy="'+y+'" rx="7.5" ry="9" fill="'+INK+'"/><circle cx="'+(x-2.5)+'" cy="'+(y-3.5)+'" r="3.2" fill="#fff"/><circle cx="'+(x+2.5)+'" cy="'+(y+3.5)+'" r="1.4" fill="#fff"/>').join("");
}
function plushMouth(mood, cx, y){
  if (mood === "cheer") return '<path d="M'+(cx-9)+' '+(y-1)+'Q'+cx+' '+(y+11)+' '+(cx+9)+' '+(y-1)+'Z" fill="#9c2159" stroke="'+INK+'" stroke-width="2.2" stroke-linejoin="round"/><path d="M'+(cx-4)+' '+(y+5)+'Q'+cx+' '+(y+2)+' '+(cx+4)+' '+(y+5)+'Q'+cx+' '+(y+9)+' '+(cx-4)+' '+(y+5)+'Z" fill="#ff7fa8"/>';
  if (mood === "sleepy") return '<ellipse cx="'+cx+'" cy="'+(y+3)+'" rx="3.4" ry="4.2" fill="#c2468a"/>';
  return '<path d="M'+(cx-8)+' '+y+'Q'+cx+' '+(y+9)+' '+(cx+8)+' '+y+'" fill="none" stroke="'+INK+'" stroke-width="2.8" stroke-linecap="round"/>';
}
function rabbitBody(mood){
  const rot = mood === "sleepy" ? 24 : mood === "cheer" ? 4 : 10, bl = mood === "cheer" ? ".95" : ".7";
  const ear = (cx, k) => '<g transform="rotate('+(k*rot)+' '+cx+' 82)"><ellipse cx="'+cx+'" cy="46" rx="16" ry="40" fill="url(#pg-w)"/><ellipse cx="'+cx+'" cy="50" rx="7.5" ry="27" fill="#ffc2d8"/></g>';
  return ear(72,-1) + ear(128,1)
   + '<ellipse cx="100" cy="208" rx="36" ry="29" fill="url(#pg-w)"/><ellipse cx="100" cy="213" rx="19" ry="16" fill="#fff"/>'
   + '<ellipse cx="66" cy="202" rx="9" ry="14" transform="rotate(18 66 202)" fill="url(#pg-w)"/><ellipse cx="134" cy="202" rx="9" ry="14" transform="rotate(-18 134 202)" fill="url(#pg-w)"/>'
   + '<ellipse cx="80" cy="233" rx="16" ry="8" fill="url(#pg-w)"/><ellipse cx="120" cy="233" rx="16" ry="8" fill="url(#pg-w)"/>'
   + '<ellipse cx="100" cy="136" rx="76" ry="60" fill="url(#pg-w)"/>'
   + '<ellipse cx="72" cy="104" rx="20" ry="9" transform="rotate(-24 72 104)" fill="#fff" opacity=".7"/>'
   + '<ellipse cx="44" cy="156" rx="10" ry="6.5" fill="#ff8db7" opacity="'+bl+'"/><ellipse cx="156" cy="156" rx="10" ry="6.5" fill="#ff8db7" opacity="'+bl+'"/>'
   + plushEyes(mood,[74,126],140) + '<path d="M94 150q6 6 12 0q-6-3-12 0z" fill="#ff6f9f"/>' + plushMouth(mood,100,158)
   + starP(124,86,1.1,"#ffd54d");
}
function hangBody(mood){
  const bl = mood === "cheer" ? ".95" : ".7";
  return '<ellipse cx="100" cy="128" rx="68" ry="62" fill="url(#pg-h)"/>'
   + '<path d="M70 180Q100 172 130 180L143 232Q100 246 57 232Z" fill="url(#pg-d)"/><path d="M88 178L100 196L112 178Z" fill="#fff"/>'
   + '<path d="M68 186Q28 168 20 212Q44 198 64 210Z" fill="#fff6fa"/><path d="M132 186Q172 168 180 212Q156 198 136 210Z" fill="#fff6fa"/>'
   + '<path d="M62 232Q100 214 138 232" fill="none" stroke="#ffe27a" stroke-width="5" stroke-linecap="round"/>'
   + '<circle cx="46" cy="72" r="19" fill="url(#pg-h)"/><circle cx="154" cy="72" r="19" fill="url(#pg-h)"/>'
   + '<ellipse cx="100" cy="126" rx="62" ry="52" fill="url(#pg-s)"/>'
   + '<path d="M36 124Q36 64 100 62Q164 64 164 124Q150 96 130 98Q116 90 100 100Q84 90 70 98Q50 96 36 124Z" fill="url(#pg-h)"/>'
   + '<ellipse cx="72" cy="84" rx="22" ry="7" transform="rotate(-18 72 84)" fill="#fff" opacity=".35"/>'
   + starP(46,72,1.1,"#ffd54d") + starP(154,72,1.1,"#ffd54d") + starP(100,70,1.3,"#ffd54d")
   + '<ellipse cx="62" cy="146" rx="10" ry="6.5" fill="#ff8db7" opacity="'+bl+'"/><ellipse cx="138" cy="146" rx="10" ry="6.5" fill="#ff8db7" opacity="'+bl+'"/>'
   + plushEyes(mood,[76,124],132) + plushMouth(mood,100,150);
}
/* mood: "happy" | "cheer" (ăn mừng) | "sleepy" (buồn ngủ, nhắc nhở). crop=true: chỉ lấy phần đầu làm logo */
function mascotSVG(mood, kind, crop){
  kind = kind || mascotKind(); mood = mood || "happy";
  const body = kind === "hang" ? hangBody(mood) : rabbitBody(mood);
  const spark = mood === "cheer" ? starP(22,40,1.3,"#ffd54d")+starP(182,30,1.6,"#ffd54d")+starP(176,104,.9,"#fff")+starP(24,104,.8,"#fff") : "";
  const zz = mood === "sleepy" ? '<text x="150" y="58" font-family="Baloo 2,sans-serif" font-weight="800" font-size="30" fill="#c92f72">z</text><text x="172" y="30" font-family="Baloo 2,sans-serif" font-weight="800" font-size="20" fill="#e27aa7">z</text>' : "";
  return '<svg class="mascot '+mood+'" viewBox="'+(crop ? "20 0 160 200" : "0 0 200 244")+'" role="img" aria-label="'+MASCOTS[kind].name+'">'
   + '<ellipse cx="100" cy="238" rx="56" ry="7" fill="#9c2159" opacity=".14"/>'
   + (mood === "sleepy" ? '<g transform="rotate(-4 100 232)">'+body+'</g>' : body) + spark + zz + '</svg>';
}
const mascot = (mood) => h("span", {html: mascotSVG(mood)});
function flowerSVG(bloom){
  return bloom
   ? '<svg viewBox="-12 -12 24 24" aria-hidden="true"><circle r="11" fill="#ffe27a" opacity=".35"/>'+starP(0,0,1.05,"#ffd54d",'stroke="#e2b100" stroke-width="1"')+'</svg>'
   : '<svg viewBox="-12 -12 24 24" aria-hidden="true">'+starP(0,0,1.05,"none",'stroke="#ffb0cd" stroke-width="1.2" stroke-dasharray="2 1.6"')+'</svg>';
}
function constellationEl(list){
  const P = [[42,184],[98,148],[154,178],[210,136],[266,164],[318,122]], DAYS = ["T2","T3","T4","T5","T6","T7"];
  const done = P.map((_,i) => !!(list[i] && isDone(list[i].id))), cur = done.indexOf(false), nDone = done.filter(Boolean).length;
  const f = v => Math.round(v*10)/10;
  const seg = i => { const p0 = P[Math.max(i-1,0)], p1 = P[i], p2 = P[i+1], p3 = P[Math.min(i+2,5)];
    return "M"+p1[0]+" "+p1[1]+" C"+f(p1[0]+(p2[0]-p0[0])/6)+" "+f(p1[1]+(p2[1]-p0[1])/6)+" "+f(p2[0]-(p3[0]-p1[0])/6)+" "+f(p2[1]-(p3[1]-p1[1])/6)+" "+p2[0]+" "+p2[1]; };
  let lit = "", rest = "", stars = "", labels = "";
  for (let i = 0; i < 5; i++){ if (done[i]) lit += seg(i)+" "; else rest += seg(i)+" "; }
  P.forEach((p,i) => {
    if (done[i]) stars += '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="20" fill="#ffe27a" opacity=".3" filter="url(#cgl)"/>'+starP(p[0],p[1],1.4,"#ffe27a");
    else if (i === cur) stars += '<circle class="pulse" cx="'+p[0]+'" cy="'+p[1]+'" r="20" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="3 4"/>'+starP(p[0],p[1],1.4,"#fff");
    else stars += starP(p[0],p[1],1.2,"#c13f7c",'stroke="#fff" stroke-width="1.1"');
    labels += '<text x="'+p[0]+'" y="'+(p[1]+32)+'" fill="#fff" opacity="'+(done[i] || i === cur ? 1 : .8)+'">'+DAYS[i]+'</text>';
  });
  const dust = [[20,64,9],[318,70,8],[40,236,8],[190,230,9],[330,196,9],[150,76,7]].map(d => '<path d="'+STAR_D+'" transform="translate('+d[0]+' '+d[1]+') scale('+d[2]/20+')" fill="#fff" opacity=".8"/>').join("");
  const other = mascotKind() === "hang" ? "bunny" : "hang";
  const el = h("div",{class:"const", role:"img", "aria-label":"Chòm sao tuần này: "+nDone+" trên 6 sao đã sáng"});
  el.innerHTML = '<svg class="sky" viewBox="0 0 358 282" preserveAspectRatio="xMidYMid meet" aria-hidden="true">'
    + dust + '<svg x="150" y="100" width="150" height="183" viewBox="0 0 200 244" opacity=".12">'+rabbitBody("happy")+'</svg>'
    + (rest ? '<path d="'+rest+'" stroke="#ffc2d8" stroke-width="2.2" stroke-dasharray="1 7" stroke-linecap="round" fill="none"/>' : "")
    + (lit ? '<path d="'+lit+'" stroke="#ffe27a" stroke-width="7" fill="none" stroke-linecap="round" opacity=".45" filter="url(#cgl)"/><path d="'+lit+'" stroke="#ffe27a" stroke-width="3" fill="none" stroke-linecap="round"/>' : "")
    + stars + '<g font-family="Nunito,sans-serif" font-weight="800" font-size="12" text-anchor="middle">'+labels+'</g></svg>'
    + '<div class="ct">Tuần '+weekNo()+' · '+((WEEKS[weekNo()]||WEEK1).title)+'</div><div class="cp">'+nDone+' / 6 sao</div>'
    + '<div class="cb"><i style="width:'+Math.round(nDone/6*100)+'%"></i></div><div class="corner">'+mascotSVG(nDone >= 6 ? "cheer" : "happy", other)+'</div>';
  return el;
}
function applyBrand(){
  document.getElementById("logo").innerHTML = mascotSVG("happy", null, true);
  applyTheme(themeKind());
  document.getElementById("mname").textContent = "cùng " + MASCOTS[mascotKind()].name;
}

/* =====================================================================
   TRẠNG THÁI & LƯU TRỮ (localStorage + Supabase tùy chọn)
   ===================================================================== */
const defaultState = () => ({
  v:2, updatedAt:0, sessions:{}, vocab:{}, mistakes:[], activeDays:[], writing:{}, results:{},
  settings:{ name:"", mascot:"bunny", theme:"light", startDate:null },
  teacherNote:null, feedback:{}, log:[], dayMin:{}, challenges:{},
  stats:{ plays:0, fixed:0, perfect:0, best:0 }, placement:null, lastUnlocked:[]
});
function normalize(o){
  const base = defaultState(), r = Object.assign(base, o || {});
  r.settings = Object.assign(defaultState().settings, (o && o.settings) || {});
  r.stats = Object.assign(defaultState().stats, (o && o.stats) || {});
  return r;
}
let S = defaultState();
function ensureStart(){ if (!S.settings.startDate) S.settings.startDate = dkey(mondayOf(new Date())); }
function loadLocal(){ try { return normalize(JSON.parse(localStorage.getItem(KEY))); } catch(e){ return defaultState(); } }
const Cloud = { ready:false };
const DB = {
  h(extra){ return Object.assign({ apikey:CONFIG.supabase.key, Authorization:"Bearer " + CONFIG.supabase.key }, extra || {}); },
  async get(ids){
    const list = [].concat(ids).map(encodeURIComponent).join(",");
    const r = await fetch(CONFIG.supabase.url + "/rest/v1/kv?id=in.(" + list + ")&select=id,data,at", { headers:DB.h() });
    if (!r.ok) throw new Error("Supabase " + r.status + " " + (await r.text()).slice(0, 200));
    return r.json();

async function initCloud(){

      S = normalize(row.data); ensureStart();

function refItems(key, idxs){ return idxs.map(i => Object.assign({}, SET[key].items[i], {_ref:key+"#"+i})); }
function subsetOf(key, n){ const idx = shuffle(SET[key].items.map((_,i) => i)).slice(0,n); return refItems(key, idx); }
function mixSets(){
  const out = [];
  ["mcq","gap","reorder","fix","form","truefalse","transform"].forEach(t => { const items = shuffle(poolItems(t)).slice(0, 3);
    if (items.length) out.push({ type:t, title:TYPES[t].label, instruction:TYPES[t].how, items }); });
  return out.slice(0, 5);
}
function resolveRef(ref){
  const [k, i] = String(ref).split("#"), s = SET[k];
  return s && s.items[+i] ? { type:s.type, item:Object.assign({}, s.items[+i], {_ref:ref}) } : null;
}
function buildMistakeSets(){
  const seen = new Set(), by = {};
  for (const m of S.mistakes.slice().reverse()){
    if (!m.ref || seen.has(m.ref) || seen.size >= 8) continue;
    const r = resolveRef(m.ref); if (!r) continue; seen.add(m.ref); (by[r.type] = by[r.type] || []).push(r.item);
  }
  return Object.keys(by).map(t => { const set = { type:t, title:"Ôn câu sai: "+TYPE_LABEL[t], instruction:"Làm đúng thì câu này sẽ biến khỏi danh sách.", items:by[t] };
    return set; });
}

const optIndex = (opts, a) => { let i = opts.indexOf(a); if (i < 0){ const k = String(a).trim().toLowerCase(); i = opts.findIndex(o => String(o).trim().toLowerCase() === k); } return i; };

function validateItem(type, it, w, E, W){

    need(Array.isArray(it.options) && it.options.length >= 2 && it.options.every(isStr), "thiếu options (mảng ít nhất 2 chuỗi)");

      if (type === "oddone") need(it.options.length === 4, "oddone nên có đúng 4 lựa chọn");
    }
    if (type === "mcq") need(isStr(it.q), "thiếu q");
    if (type === "listenpick") need(isStr(it.say), "thiếu say (câu sẽ được đọc)");
    if (type === "dialogue") need(Array.isArray(it.lines) && it.lines.length >= 1 && it.lines.every(isStr), "thiếu lines (mảng các lượt thoại)");
  } else if (type === "truefalse"){ need(isStr(it.q), "thiếu q"); need(typeof it.answer === "boolean", "answer phải là true hoặc false (không có dấu nháy)");

  } else if (type === "dictation" || type === "shadow"){ need(isStr(it.say), "thiếu say");

}
function validateSet(raw, w, E, W, seen){
  if (!raw || typeof raw !== "object") { E.push(w + ": bộ bài không hợp lệ"); return {n:0, core:0, sec:0}; }
  if (!TYPES[raw.type]) { E.push(w + ": type \"" + raw.type + "\" không có. Dùng: " + Object.keys(TYPES).join(", ")); return {n:0, core:0, sec:0}; }

  const type = raw.type;
  raw.items.forEach((it, i) => {
    validateItem(type, it, w + " (" + type + ") câu " + (i+1), E, W);
    if (raw.ungraded || !it || typeof it !== "object") return;   // câu khởi động được phép lặp lại ở phần luyện tập
    const base = norm([it.q, it.say, it.text, it.prompt, it.wrong, it.left, (it.words || []).join(" ")].filter(isStr).join(" "));
    const ans = norm(String(typeof it.answer === "number" && it.options ? it.options[it.answer] : (it.answer != null ? it.answer : (it.right || ""))));
    const key = base + "|" + ans;
    if (isStr(it.why)){ const wk = it.why.trim(); const r = seen.why.get(wk) || { n:0, at:w + " câu " + (i+1) }; r.n++; seen.why.set(wk, r); }
    { const pk = (it.q || it.text || it.say || it.prompt || "").replace(/\b[A-Z][a-z]+\b/g, "N").replace(/\b(father|mother|sister|brother|parents|grandmother|grandfather|uncle|aunt|cousin|teacher|doctor|driver|nurse)\b/gi, "W").trim(); if (pk.length > 12){ const r = seen.pat.get(pk) || { n:0, at:w + " câu " + (i+1) }; r.n++; seen.pat.set(pk, r); } }

  if (type === "match" && raw.items.length < 4) W.push(w + ": match nên có từ 4 cặp trở lên");

  if (raw.core != null){ if (!Number.isInteger(raw.core) || raw.core < 1 || raw.core > raw.items.length) E.push(w + ": core phải là số nguyên từ 1 đến " + raw.items.length); else core = raw.core; }

function validateWeek(j){

        if (!Array.isArray(st.text) || !st.text.length) E.push(sw + ": thiếu text (bài đọc để tìm ngữ pháp)."); if (!Array.isArray(st.target) || !st.target.length) E.push(sw + ": thiếu target (mảng các từ cần tìm).");
        if (!st.box || !Array.isArray(st.box.rows) || !st.box.rows.length) E.push(sw + ": thiếu box.rows (bảng ghi nhớ).");
      }
      if (st.type === "output"){ ["prompt","hint","sample","model"].forEach(f => { if (!isStr(st[f])) E.push(sw + ": thiếu " + f + "."); });
        if (st.checklist && (!Array.isArray(st.checklist) || !st.checklist.every(isStr))) E.push(sw + ": checklist phải là mảng chuỗi."); }
      if (st.type === "sets" && (!Array.isArray(st.sets) || !st.sets.length)) E.push(sw + ": thiếu sets.");
      (st.sets || []).forEach((raw, xi) => { const r = validateSet(raw, sw + " bộ " + (xi+1), E, W, seen); n += r.n; core += r.core; sec += r.sec; });

function parseWeekText(txt){
  let t = String(txt || "").replace(/^\uFEFF/, "").trim();
  const fences = [...t.matchAll(/```(?:json)?\s*([\s\S]*?)```/gi)].map(m => m[1].trim()).filter(Boolean);
  const chunks = fences.length ? fences : [t], out = [];
  for (let i = 0; i < chunks.length; i++){
    try { const v = JSON.parse(chunks[i]); if (Array.isArray(v)) out.push(...v); else out.push(v); }
    catch(e){
      const pos = (String(e.message).match(/position (\d+)/) || [])[1];
      let hint = ""; if (pos != null){ const p = +pos, line = chunks[i].slice(0, p).split("\n").length; hint = " (gần dòng " + line + ": …" + chunks[i].slice(Math.max(0, p-30), p+30).replace(/\s+/g," ") + "…)"; }
      return { err:"Không đọc được JSON" + (chunks.length > 1 ? " ở khối thứ " + (i+1) : "") + ": thường do thiếu dấu phẩy, thừa dấu phẩy cuối danh sách, hoặc dấu \" chưa đóng." + hint };
    }
  }
  return { v: out.length === 1 ? out[0] : out };
}

  res.forEach((x, i) => {

    const at = ref ? S.mistakes.findIndex(m => m.ref === ref) : -1;

/* Lịch theo ngày: ngày bắt đầu (thứ Hai đầu tuần 1) → buổi của hôm nay */
function todayInfo(){
  const start = parseKey(S.settings.startDate || dkey(mondayOf(new Date())));
  const now = new Date(); now.setHours(0,0,0,0);
  const diff = Math.round((now - start) / 86400000);
  if (diff < 0) return { state:"before", days:-diff };
  const week = Math.floor(diff / 7) + 1, wd = diff % 7;
  if (!WEEKS[week]) return { state:"beyond", week };
  if (wd === 6) return { state:"rest", week };
  return { state:"day", wd, week, session:WEEKS[week].sessions[wd] };
}

let voices = [], audioToken = 0, audioEl = null;

function stopAudio(){
  audioToken++;
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  if (audioEl){ audioEl.pause(); audioEl = null; }
}
function playAudio({text, src, rate}, onend){
  stopAudio(); const my = audioToken;
  const end = ok => { if (my === audioToken) onend && onend(ok); };
  if (src){ audioEl = new Audio(src); audioEl.playbackRate = rate || 1; audioEl.onended = () => end(true); audioEl.onerror = () => end(false); audioEl.play().catch(() => end(false)); return true; }
  if (!("speechSynthesis" in window)){ toast("Trình duyệt này chưa đọc được tiếng Anh"); return false; }
  const u = new SpeechSynthesisUtterance(text); u.rate = rate || 1;
  const want = (CONFIG.voiceName || "").toLowerCase();
  const v = (want && voices.find(x => (x.name || "").toLowerCase().includes(want)))   // giọng ưu tiên, ví dụ Sonia
    || voices.find(x => /en[-_]US/i.test(x.lang)) || voices.find(x => /^en/i.test(x.lang));
  u.lang = v ? v.lang : "en-US"; if (v) u.voice = v;
  u.onend = () => end(true); u.onerror = () => end(false);
  speechSynthesis.speak(u); return true;
}

function expand(s){
  return String(s).toLowerCase().replace(/[’‘]/g,"'")
    .replace(/\bi'm\b/g,"i am").replace(/\b(he|she|it|that|there|what|who|where|here)'s\b/g,"$1 is").replace(/\b(we|you|they)'re\b/g,"$1 are")
    .replace(/\bcan't\b/g,"can not").replace(/\bcannot\b/g,"can not").replace(/\bwon't\b/g,"will not")
    .replace(/\b(is|are|was|were|do|does|did|have|has|had|could|would|should)n't\b/g,"$1 not");
}

  return h("div",null, h("a",{class:"btn soft",href:"#/settings"},"← Cài đặt"), h("h1",{style:"margin-top:16px"},"Tải bài học lên"),
    h("div",{class:"card tint flat small"}, "1) Dùng prompt trong file PROMPT-soan-tuan-1-GPT.md để GPT soạn bài. 2) Dán JSON hoặc chọn file ở dưới. 3) Xem kết quả kiểm tra rồi bấm Lưu. Tuần có sẵn sẽ được thay bằng bản mới."),
    h("div",{class:"card"}, h("h3",null,"Dán hoặc chọn file JSON"), ta,
      h("div",{class:"row",style:"margin-top:10px"}, h("button",{class:"btn",type:"button",onClick:check},"Kiểm tra"), h("button",{class:"btn soft",type:"button",onClick:() => fileIn.click()},"Chọn file…"), fileIn)),
    out, h("div",{class:"card"}, h("h3",null,"Các tuần đang có"), rows.length ? rows : h("p",{class:"muted"},"Chưa có tuần nào.")),
    h("div",{class:"card flat small muted"}, Cloud.ready ? "Nội dung đang được lưu trên đám mây, mọi thiết bị của học viên sẽ thấy." : "Chưa kết nối đám mây: nội dung chỉ lưu trong trình duyệt này. Muốn mọi thiết bị thấy, hãy kiểm tra kết nối hoặc đưa file vào thư mục weeks/ của repo (xem README)."));
}

/* =====================================================================
   DỮ LIỆU DEMO
   ===================================================================== */
function demoState(){
  const s = defaultState(); s.settings = Object.assign({}, S.settings);
  const fillSteps = id => { const o = {}; LESSONS[id].steps.forEach(x => { o[x.key] = true; }); return o; };
  [["w1-mon",1740,3],["w1-tue",1620,2],["w1-wed",1800,1]].forEach(([id, sec, ago]) => {
    s.sessions[id] = { steps:fillSteps(id), seconds:sec, startedAt:Date.now()-ago*86400000, done:true, doneAt:Date.now()-ago*86400000 };
    s.log.push({ d:addDays(-ago), id, sec });
  });
  s.sessions["w1-thu"] = { steps:{warmup:true, review:true}, seconds:660, startedAt:Date.now(), done:false };
  [1,2,3,4].forEach(n => { s.activeDays.push(addDays(-n)); s.dayMin[addDays(-n)] = 1500 + n*60; });
  s.dayMin[addDays(0)] = 660;
  s.results = { mcq:{right:21,total:26}, gap:{right:9,total:10}, reorder:{right:6,total:8}, fix:{right:5,total:9}, form:{right:8,total:10}, notice:{right:36,total:36} };
  ["fix1#0","fix1#3","reorder1#2","mcq1#2","form1#2"].forEach(ref => { const r = resolveRef(ref); if (!r) return; const it = r.item;
    s.mistakes.push({ ref, t:r.type, q:it.q || it.text || it.wrong || (it.words||[]).join(" / "), a:it.options ? it.options[it.answer] : it.answer, why:it.why, at:addDays(-1) }); });
  const words = Object.assign({}, VOC_MON, VOC_TUE); let i = 0;
  Object.keys(words).forEach(w => { const box = i % 4; s.vocab[w] = { m:words[w], box, due: i < 6 ? addDays(0) : addDays(box + 1) }; i++; });
  s.writing = { "w1-mon":"This is my mother. Her name is Hoa. She is a teacher.", "w1-wed":"This is my father. He is not a teacher. He is a driver." };
  s.feedback = { "w1-mon":"Câu rất tốt! Nhớ viết hoa chữ Hoa nhé." };
  s.stats = { plays:12, fixed:3, perfect:2, best:4 };
  return s;
}

/* =====================================================================
   ĐIỀU HƯỚNG
   ===================================================================== */
const TABS = [["home","🏠","Trang chủ"],["week","📅","Tuần học"],["vocab","📖","Từ vựng"],["practice","✏️","Bài tập"],["progress","⭐","Tiến độ"]];
const TAB_OF = { challenge:"week", content:"week", lesson:"week", done:"week", placement:"week", mistakes:"practice", report:"progress" };
const tabsEl = document.getElementById("tabs");
tabsEl.replaceChildren(...TABS.map(([p,ic,t]) => h("a",{href:"#/"+p,"data-p":p}, h("span",null,ic), t)));
function route(){
  stopAudio(); activeLesson = null; review = null;
  const parts = location.hash.replace(/^#\/?/,"").split("/"), page = parts[0] || "home";
  document.body.classList.toggle("immersive", page === "lesson");
  let view;
  switch (page){
    case "week": view = weekView(); break;
    case "lesson": view = lessonView(parts[1], parseInt(parts[2] || "0", 10)); break;
    case "done": view = doneView(parts[1]); break;
    case "challenge": view = challengeView(parts[1]); break;
    case "content": view = contentView(); break;
    case "vocab": view = vocabView(); break;
    case "practice": view = practiceView(parts[1]); break;
    case "mistakes": view = mistakesView(); break;
    case "placement": view = placementView(); break;
    case "report": view = h("div",null, h("h1",null,"Báo cáo tuần "+weekNo()), reportEl()); break;
    case "settings": view = settingsView(); break;
    case "teacher": view = teacherView(); break;
    case "progress": view = progressView(); break;
    default: view = homeView();
  }
  app.replaceChildren(view); window.scrollTo(0,0);
  const tab = TAB_OF[page] || page;
  tabsEl.querySelectorAll("a").forEach(a => a.classList.toggle("on", a.dataset.p === tab));
}
setInterval(() => {
  if (!activeLesson || document.hidden) return;
  const s = ensureSession(activeLesson); s.seconds = (s.seconds || 0) + 1;
  const dk = dkey(new Date()); S.dayMin[dk] = (S.dayMin[dk] || 0) + 1;
  const c = document.getElementById("clock"); if (c) c.textContent = "⏱ " + fmt(s.seconds);
  if (s.seconds % 10 === 0) save();
}, 1000);

document.addEventListener("focusin", e => {
  const t = e.target; if (!t.matches || !t.matches("input.txt,textarea.txt")) return;
  if (t.type !== "date"){ t.setAttribute("autocapitalize","off"); t.setAttribute("autocomplete","off"); t.setAttribute("autocorrect","off"); t.spellcheck = false; }
  document.body.classList.add("kb");
  if (t.type !== "date") setTimeout(() => { try { t.scrollIntoView({block:"center", behavior:"smooth"}); } catch(e){} }, 250);
});
document.addEventListener("focusout", () => setTimeout(() => { const a = document.activeElement; if (!(a && a.matches && a.matches("input.txt,textarea.txt"))) document.body.classList.remove("kb"); }, 60));
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
async function boot(){
  S = loadLocal(); ensureStart(); applyBrand(); loadContentLocal();
  document.getElementById("themebtn").addEventListener("click", () => {
    S.settings.theme = themeKind() === "night" ? "light" : "night"; save(); applyBrand();
    if (location.hash.startsWith("#/settings")) route();
  });
  await initCloud(); applyBrand(); await loadContentCloud(); await loadContentStatic();
  window.addEventListener("hashchange", route);
  route();
}
boot();
})();
